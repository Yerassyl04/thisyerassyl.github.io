# Russian strings for the site language toggle (see `_includes/header.liquid`).
#
# Keys are the *exact* English source text as rendered by the theme. A string with
# no entry here stays in English, so this file can grow page by page.
#
# Only plain-text labels are swapped. A description containing inline markup
# (e.g. the backticks in `_pages/repositories.md`) is skipped by design — the
# toggle rewrites a single text node and will not rebuild inner HTML.

# Navbar labels. These double as the `.post-title` on each page, since the theme
# renders both from the page's `title:` front matter.
nav:
  about: обо мне
  publications: публикации
  projects: проекты
  repositories: репозитории
  CV: резюме

# Page subtitles and descriptions.
text:
  "Information Technologies graduate and researcher.": "Выпускник и исследователь в области информационных технологий."
  "publications by categories in reversed chronological order. generated by jekyll-scholar.": "публикации по категориям в обратном хронологическом порядке. сгенерировано jekyll-scholar."
  "A growing collection of your cool projects.": "Растущая коллекция проектов."
  "Curriculum vitae of Yerassyl Iskakov.": "Резюме Ерасыла Искакова."
